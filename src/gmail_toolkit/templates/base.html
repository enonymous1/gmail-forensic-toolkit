<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Gmail Forensic Toolkit{% endblock %}</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  nav a { margin-right: 1rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; vertical-align: top; }
  th { background: #f0f0f0; }
  .note { background: #fff8e1; border: 1px solid #e6c200; padding: 0.6rem 1rem; }
  .warning { background: #fdecea; border: 1px solid #d9534f; padding: 0.6rem 1rem; }
  .meta { color: #555; }
  pre, code { background: #f5f5f5; }
  pre { padding: 1rem; overflow-x: auto; }
  blockquote { border-left: 3px solid #ccc; margin-left: 0; padding-left: 1rem; color: #444; }
</style>
</head>
<body>
<nav>
  <a href="/">Home</a>
  <a href="/reports">Reports</a>
  <a href="/labels">Labels</a>
  <a href="/calendar">Calendar</a>
</nav>
<p class="note">Read-only viewer. It serves files under <code>{{ exports_dir }}</code> only, never contacts Gmail, and never modifies an export.</p>
{% block content %}{% endblock %}
</body>
</html>
